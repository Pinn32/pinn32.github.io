project:
  type: website
  # A normal render updates _site in place and can leave removed resources
  # behind. Start clean so stale local media can never enter a Pages publish.
  pre-render: bash scripts/clean-site-output.sh
  post-render: bash scripts/check-site-output.sh
  render:
    - "*.{qmd,R,py,md}"
    - "!archive/**/*"
    - "!README.zh.md"
    - "!*.ejs.md"
  resources:
    # Video and gallery media are served from cdn.mcp32.com. Do not copy local
    # media masters or render-only datasets into the gh-pages branch.
    - "src/img/**"
    - "src/data/colab-plotly-export/**"
    - "src/data/fix-network-diagram/**"
  preview: 
    # host: 0.0.0.0
    port: 4200

website:
  site-url: https://pinn32.github.io
  title: "pinn.xu"
  description: "A collection of projects by Pinn (Aiqi) Xu, showcasing work in data science, machine learning, and software development."
  favicon: src/img/favicon/spark.ico

  back-to-top-navigation: true
  page-footer: 
    left: | 
      © Copyright <span id="copyright-year"></span>, Pinn (Aiqi) Xu. All rights reserved.
  
  repo-url: https://github.com/Pinn32/pinn32.github.io
