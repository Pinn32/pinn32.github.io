###############################################################################
format:
  html:
    # self-contained: false
    lightbox: true
    image-lazy-loading: true
    smooth-scroll: true
    syntax-highlighting: 
      light: pygments
      dark: atom-one
    respect-user-color-scheme: true
    theme:
      light: [minty, ./src/styles/portfolio.scss]
      dark:  [minty, ./src/styles/portfolio-dark.scss]
    css:
      - ./src/styles/style.css      # shared rule set common to both themes
    from: markdown+mark    # enable `==mark==` syntax for highlighting text

    # external links
    link-external-icon: true
    link-external-newwindow: true
    link-external-filter: '^(?:https?:\/\/)?(?:pinn32\.github\.io\/(?:en|zh|dv-projects|img)|raw\.githubusercontent\.com\/Pinn32\/img)(?:\/|$)'
    
    ###### JS Scripts ######
    include-after-body:
      - ./src/scripts/site-fixes.html  # all global fixes & add-on features

    toc: true
    # toc-expand: true
    # toc-depth: 3
    code-tools: true
      # toggle: true
      # source: true
      # caption: "hi"
    code-fold: true
    # code-summary: "Show the code"


##############################################################################

# lang: en
brand: _brand.yml
editor: source
filters:
  - src/filters/subtitle-typing.lua  # string = static; list = rotating typewriter
  - src/filters/reading-stats.lua  # for reading time
  - src/filters/changelog-timeline.lua  # change-log timeline (en/changes)
  - src/filters/lazy-images.lua  # lazy-load + async-decode body images
