<!--
    Global Site Fixes — injected at end of <body> on every page via _quarto.yml.
    Each concern lives in its own <script> block so its execution timing is
    preserved (inline IIFE = before paint; DOMContentLoaded = after parse).

    Table of contents
    ─────────────────
    1. script-strip-index-html   Strip internal links' .../index.html suffixes
    2. script-fix-navbar-active  Fix navbar active state when a global sidebar is present
    3. script-nav-lang-switch    Switch navbar header language
    4. script-fix-code-fold      Wire the "show all / hide all code" buttons
    5. script-fix-sidebar-toggle Make sidebar section row's empty area toggle collapse
    6. script-fix-sidebar-search Replace the dead sidebar search box with a working button
    7. script-fix-tag-redirect   Redirect post-page tag links to their listing page
    8. script-copyright-year     Update the copyright year in the footer
    9. script-mermaid-early      Render Mermaid diagrams at parse time, not on window.load
   10. script-lst-wrap-output    Pull knitr's output cell into the listing <figure> (like Jupyter)
   11. script-lst-caption-below  Move code-listing (lst) captions below the output
   12. script-fix-video-playback Load videos reliably with or without HTTP byte ranges
   13. script-subtitle-typewriter Animate rotating page subtitles

    Page-specific scripts (responsive-tag-bar, post-type-filter)
    live in their own files and are included separately.
-->

<script id="script-strip-index-html">
    // Strip internal links' .../index.html suffixes

    // Runs inline at end of <body>: links are already parsed, and rewriting before paint
    // avoids changing hrefs the user might hover mid-load.
    (() => {
        document.querySelectorAll('a[href]').forEach(link => {
            const href = link.getAttribute('href');
            if (!href) return;

            // Skip anchors, mailto/tel, protocol-relative, and absolute external URLs.
            if (/^(#|mailto:|tel:|\/\/)/.test(href)) return;

            try {
                const url = new URL(href, window.location.href);
                // Only touch same-origin links.
                if (url.origin !== window.location.origin) return;
                if (!/\/index\.html$/.test(url.pathname)) return;

                url.pathname = url.pathname.replace(/\/index\.html$/, '/');
                // Write a root-absolute path. This is safe even under the GitHub Pages
                // `/dv-projects/` base, since `url.pathname` already includes that prefix
                // (the original relative href was resolved against the current page).
                link.setAttribute('href', url.pathname + url.search + url.hash);
            } catch {
                // Malformed href — leave it untouched.
            }
        });
    })();
</script>

<script id="script-fix-navbar-active">
    // Fix Quarto's incorrect navbar active state when a global sidebar is present.

    // Runs inline (no DOMContentLoaded) because the script is injected at end of <body>
    // so the navbar DOM is already parsed — executing before paint prevents the flash.
    // Compares path sections (/en|zh/section/...) so it works without waiting for
    // script-nav-lang-switch to rewrite hrefs on zh pages.
    (() => {
        const path = window.location.pathname.replace(/\/index\.html$/, '/');
        const pageSectionMatch = path.match(/\/(?:en|zh)\/([^/]+)/);
        const pageSection = pageSectionMatch ? pageSectionMatch[1] : null;

        document.querySelectorAll('.navbar-nav .nav-link').forEach(link => {
            let linkSections = [];

            if (link.classList.contains('dropdown-toggle')) {
                // A dropdown toggle uses href="#", which resolves to the current
                // page and must not determine its active state. Derive the parent
                // section from the destinations represented by its submenu.
                const dropdown = link.closest('.nav-item.dropdown');
                linkSections = [...(dropdown?.querySelectorAll('.dropdown-item[href]') ?? [])]
                    .map(item => {
                        try {
                            const itemPath = new URL(item.getAttribute('href'), window.location.href).pathname;
                            return itemPath.match(/\/(?:en|zh)\/([^/]+)/)?.[1] ?? null;
                        } catch {
                            return null;
                        }
                    })
                    .filter(Boolean);
            } else {
                const href = link.getAttribute('href');
                if (href) {
                    try {
                        const linkPath = new URL(href, window.location.href).pathname;
                        const linkSectionMatch = linkPath.match(/\/(?:en|zh)\/([^/]+)/);
                        linkSections = linkSectionMatch ? [linkSectionMatch[1]] : [];
                    } catch {
                        // href is malformed — leave this link inactive
                    }
                }
            }

            const isActive = pageSection !== null && linkSections.includes(pageSection);
            link.classList.toggle('active', isActive);
            if (isActive) link.setAttribute('aria-current', 'page');
            else link.removeAttribute('aria-current');
        });
    })();
</script>

<script id="script-nav-lang-switch">
    // Switch navbar header language

    const switchLanguage = targetLang => {
        const path = window.location.pathname;
        // Capture base (e.g. '' locally, '/dv-projects' on GitHub Pages)
        const match = path.match(/^(.*?)\/(en|zh)(\/.*)?$/);
        if (match) {
            const base = match[1];
            const rest = match[3] || '/';
            window.location.pathname = `${base}/${targetLang}${rest}`;
        } else {
            window.location.pathname = `/${targetLang}/`;
        }
    };

    const NAV_TRANSLATIONS = {
        en: {
            Projects: 'Projects',
            Tutorials: 'Tutorials',
            Tools: 'Tools',
            Blogs: 'Blogs',
            Media: 'Media',
            'Video & Animation': 'Video & Animation',
            'Art & Painting': 'Art & Painting',
            'Music & Instrument': 'Music & Instrument',
            'All Posts': 'All Posts',
            About: 'About',
            Contact: 'Contact',
            Changes: 'Changes'
        },
        zh: {
            Projects: '项目',
            Tutorials: '教程',
            Tools: '工具',
            Blogs: '博客',
            Media: '媒体',
            'Video & Animation': '视频与动画',
            'Art & Painting': '艺术与绘画',
            'Music & Instrument': '音乐与乐器',
            'All Posts': '所有文章',
            About: '关于',
            Contact: '联系作者',
            Changes: '更新日志'
        },
    };

    document.addEventListener('DOMContentLoaded', () => {
        // 遍历所有 navbar 下拉菜单链接，按文字匹配
        document.querySelectorAll('.navbar .dropdown-item').forEach(el => {
            const text = el.textContent.trim();
            if (text === 'English') {
                el.addEventListener('click', e => {
                    e.preventDefault();
                    switchLanguage('en');
                });
            } else if (text === '中文') {
                el.addEventListener('click', e => {
                    e.preventDefault();
                    switchLanguage('zh');
                });
            }
        });

        // Translate navbar left-side links to match the current page language
        const langMatch = window.location.pathname.match(/\/(en|zh)\//);
        const lang = langMatch ? langMatch[1] : 'en';
        const translations = NAV_TRANSLATIONS[lang] ?? NAV_TRANSLATIONS.en;

        document.querySelectorAll('.navbar-nav .nav-link, .navbar-nav .dropdown-item').forEach(el => {
            const text = el.textContent.trim();
            if (translations[text]) {
                el.textContent = translations[text];
            }
            // Reroute hrefs from /en/ to /zh/ (or vice-versa) to match current lang
            if (lang === 'zh' && el.href?.includes('/en/')) {
                el.href = el.href.replace('/en/', '/zh/');
            } else if (lang === 'en' && el.href?.includes('/zh/')) {
                el.href = el.href.replace('/zh/', '/en/');
            }
        });
    });
</script>

<script id="script-fix-code-fold">
    // Wire the "show all / hide all code" buttons to every code-fold <details>.
    
    const bindToggle = (id, open) => {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('click', e => {
            e.preventDefault();
            document.querySelectorAll('details.code-fold').forEach(el => {
                open ? el.setAttribute('open', '') : el.removeAttribute('open');
            });
        });
    };

    bindToggle('quarto-show-all-code', true);
    bindToggle('quarto-hide-all-code', false);
</script>

<script id="script-fix-sidebar-toggle">
    // Let sidebar section title empty area be clickable to toggle collapse/expand
    
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.sidebar-item-section > .sidebar-item-container').forEach(row => {
            row.style.cursor = 'pointer';
            row.addEventListener('click', e => {
                // title text -> let the link navigate normally
                if (e.target.closest('.sidebar-item-text')) return;
                // chevron -> Bootstrap handles it natively; don't double-toggle
                if (e.target.closest('.sidebar-item-toggle')) return;
                // empty area of the row -> trigger the toggle once
                row.querySelector('.sidebar-item-toggle')?.click();
            });
        });
    });
</script>

<script id="script-fix-sidebar-search">
    // Add-on sidebar search bar

    // Quarto autocomplete attaches to the FIRST #quarto-search (navbar, via getElementById).
    // The sidebar's duplicate #quarto-search is never initialized. Replace it with a button
    // that opens the real search overlay via window.quartoOpenSearch().

    document.addEventListener('DOMContentLoaded', () => {
        const sidebarSearchWrapper = document.querySelector('#quarto-sidebar .sidebar-search');
        if (!sidebarSearchWrapper) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'sidebar-search-trigger';
        btn.setAttribute('aria-label', 'Search');
        btn.innerHTML = '<i class="bi bi-search"></i><span>Search</span><kbd>F</kbd>';
        btn.addEventListener('click', () => window.quartoOpenSearch?.());

        sidebarSearchWrapper.replaceChildren(btn);
    });
</script>

<script id="script-fix-tag-redirect">
    // Redirect post-page tag to corresponding listing page

    document.addEventListener("DOMContentLoaded", function () {

        // 每种内容类型对应的 listing 页面（可按需增减）
        const SECTION_MAP = {
            projects:  "projects",
            tutorials: "tutorials",
            blogs:     "blogs",
            tools:     "tools",
        };

        function getTarget() {
            const path = window.location.pathname;

            // 提取语言前缀 /en/ 或 /zh/，没有则为 /
            const langMatch = path.match(/^\/(en|zh)\//);
            const langPrefix = langMatch ? "/" + langMatch[1] + "/" : "/";

            // 提取当前所在 section
            const sectionMatch = path.match(/\/(projects|tutorials|blogs|tools)\//);
            const section = sectionMatch ? sectionMatch[1] : null;

            if (!section) return null; // 不在任何已知 section 下，不重写

            return langPrefix + SECTION_MAP[section] + "/";
        }

        function rewriteTagLinks() {
            const target = getTarget();
            if (!target) return;

            document.querySelectorAll("a[href*='#category=']").forEach(function (link) {
                const category = link.href.split("#category=")[1];
                if (category) {
                    link.href = target + "#category=" + category;
                }
            });
        }

        rewriteTagLinks();
        new MutationObserver(rewriteTagLinks)
            .observe(document.body, { childList: true, subtree: true });
    });
</script>

<script id="script-copyright-year">
    // Update the copyright year in the footer

    document.addEventListener("DOMContentLoaded", function () {
        const el = document.getElementById("copyright-year");
        if (el) {
            const currentYear = new Date().getFullYear();
            el.textContent = currentYear > 2026
                ? `2026 – ${currentYear}`
                : "2026";
        }
    });
</script>

<script id="script-mermaid-early">
    // Render Mermaid diagrams at parse time instead of on window.load.
    //
    // Quarto's mermaid-init.js renders diagrams inside a `window.load` handler
    // (it sets startOnLoad:false). `load` only fires after every blocking image
    // has downloaded, so a page full of large images makes the diagram appear
    // late. This runs inline at end of <body> — by which point the parser-
    // blocking mermaid library in <head> has already initialized and the
    // diagram's <pre> is in the DOM — so the diagram renders with minimal
    // latency, independent of image loading (which `image-lazy-loading` keeps
    // from competing for bandwidth).
    //
    // We replicate ONLY mermaid-init's render+swap step, leaving the DOM in the
    // exact state Quarto's own load handler expects: its first loop then finds
    // no unrendered `pre.mermaid-js` (skips a re-render) while its second loop
    // still runs postProcess() on our SVG for final sizing/alignment. On any
    // error we leave the <pre> untouched so Quarto's load handler renders it.
    (async () => {
        const pending = Array.from(document.querySelectorAll("pre.mermaid-js"));
        if (!pending.length || !window.mermaid || !mermaid.mermaidAPI) return;

        let i = 0;
        for (const el of pending) {
            try {
                const text = el.textContent.replaceAll("&nbsp;", " ");
                const { svg: output } = await mermaid.mermaidAPI.render(
                    `mermaid-early-${++i}`, text, el
                );
                el.innerHTML = output;
                if (el.dataset.label) {
                    // patch mermaid's emitted style to use the figure's label id
                    const svg = el.firstChild;
                    const style = svg.querySelector("style");
                    style.innerHTML = style.innerHTML.replaceAll(
                        `#${svg.id}`, `#${el.dataset.label}-mermaid`
                    );
                    svg.id = el.dataset.label + "-mermaid";
                    delete el.dataset.label;
                }
                const svg = el.querySelector("svg");
                const parent = el.parentElement;
                parent.removeChild(el);
                parent.appendChild(svg);
                svg.classList.add("mermaid-js");
            } catch (e) {
                // Leave this <pre> in place; Quarto's window.load handler renders it.
            }
        }
    })();
</script>

<script id="script-lst-wrap-output">
    // Make knitr code-listings wrap BOTH the input (code) and output cell inside the
    // <figure>, matching the Jupyter engine's structure.
    //
    // Quarto's two engines lay out executable listings differently:
    //   • Jupyter — the output (.cell-output) already lives INSIDE the <figure>, so the
    //               listing element (`<div id="lst-…">`) contains code + output.
    //   • knitr   — the <figure> holds only the code; the output is a SIBLING of the
    //               listing <div>, both wrapped in an outer .cell. So `<div id="lst-…">`
    //               contains code ONLY.
    // Quarto's in-text crossref hover (see the `a.quarto-xref` tippy handler) previews a
    // reference by cloning `getElementById(id).innerHTML` — the listing <div>. Under knitr
    // that div excludes the output, so hovering `@lst-…` showed only the code. Pulling the
    // output into the figure's content wrapper fixes the preview AND unifies the DOM with
    // Jupyter, so the caption step below can treat both engines identically.
    //
    // Runs inline at end of <body> (before paint) and before script-lst-caption-below.
    (() => {
        document.querySelectorAll('figure.quarto-float-lst').forEach(figure => {
            const listing = figure.closest('.listing');
            if (!listing) return;
            // knitr's outer wrapper: a .cell holding the listing div + its output siblings.
            // (Jupyter's listing div is itself .cell, but its parent is not, so it's skipped.)
            const cell = listing.parentElement;
            if (!cell || !cell.classList.contains('cell')) return;
            const outputs = [...cell.children].filter(
                el => el !== listing && el.classList.contains('cell-output'));
            if (!outputs.length) return;
            const content = figure.querySelector(':scope > [aria-describedby]') || figure;
            outputs.forEach(out => content.appendChild(out));
        });
    })();
</script>

<script id="script-lst-caption-below">
    // Move code-listing (lst-cap) captions below the output, uniformly for both engines.
    //
    // Quarto emits the listing <figcaption> at the TOP of the <figure>. After
    // script-lst-wrap-output has run, every executable listing has its output inside the
    // <figure>, so appending the caption as the LAST child of the listing <div>
    // (`figure.closest('.listing')`) lands it after the output (executable) or after the
    // code (textual) in every case — a single CSS rule then styles all three identically,
    // with no flex/order:999 reversal. Keeping the caption inside the listing <div> (the
    // element the crossref hover clones) also means the hover preview includes the caption.
    //
    // Runs inline at end of <body>: the listing DOM is already parsed and the move
    // happens before paint, so the caption never flashes at the top first.
    (() => {
        document.querySelectorAll('figure.quarto-float-lst > figcaption.quarto-float-caption').forEach(cap => {
            const figure = cap.parentElement;
            const container = figure.closest('.listing');
            if (!container) return;
            container.appendChild(cap);
            cap.classList.remove('quarto-float-caption-top');
            cap.classList.add('quarto-float-caption-bottom');
        });
    })();
</script>

<script id="script-fix-video-playback">
    // Make native MP4 players seek and resume reliably across browsers.
    //
    // Chrome cannot seek reliably when an MP4's metadata is at the end of the
    // file and the web server does not honor byte-range requests. Probe range
    // support before assigning the source: capable servers keep normal streamed
    // playback, while incapable servers use the already-downloaded response as
    // a seekable Blob URL. Safari and Firefox retain their native players too.
    (() => {
        const objectUrls = new Set();

        async function loadVideo(source) {
            const videoSrc = source?.dataset.videoSrc;
            if (!videoSrc || source.dataset.loading === "true") return;

            const video = source.closest("video");
            if (!video) return;

            source.dataset.loading = "true";
            video.setAttribute("aria-busy", "true");

            try {
                const response = await fetch(videoSrc, {
                    headers: { Range: "bytes=0-0" },
                    cache: "no-store"
                });

                if (response.status === 206) {
                    await response.body?.cancel();
                    source.src = videoSrc;
                } else if (response.ok) {
                    const objectUrl = URL.createObjectURL(await response.blob());
                    objectUrls.add(objectUrl);
                    source.src = objectUrl;
                } else {
                    throw new Error(`Video request failed with status ${response.status}`);
                }
            } catch (error) {
                // Direct playback remains the safest fallback for offline pages,
                // restrictive privacy settings, and unexpected server responses.
                console.warn(`Unable to prepare ${videoSrc} for seeking.`, error);
                source.src = videoSrc;
            } finally {
                source.removeAttribute("data-video-src");
                source.removeAttribute("data-loading");
                video.removeAttribute("aria-busy");
                video.load();
            }
        }

        const videos = [...document.querySelectorAll("video")].filter(video =>
            video.querySelector("source[data-video-src]")
        );

        if ("IntersectionObserver" in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    observer.unobserve(entry.target);
                    loadVideo(entry.target.querySelector("source[data-video-src]"));
                });
            }, { rootMargin: "200px 0px" });

            videos.forEach(video => observer.observe(video));
        } else {
            videos.forEach(video => loadVideo(video.querySelector("source[data-video-src]")));
        }

        videos.forEach(video => {
            ["pointerdown", "focus"].forEach(eventName => {
                video.addEventListener(eventName, () => {
                    loadVideo(video.querySelector("source[data-video-src]"));
                }, { once: true });
            });

            // Do not let gallery players continue over one another.
            video.addEventListener("play", () => {
                document.querySelectorAll("video").forEach(otherVideo => {
                    if (otherVideo !== video && !otherVideo.paused) otherVideo.pause();
                });
            });
        });

        window.addEventListener("pagehide", () => {
            objectUrls.forEach(objectUrl => URL.revokeObjectURL(objectUrl));
            objectUrls.clear();
        });
    })();
</script>

<script id="script-subtitle-typewriter">
    // Animate rotating page subtitles.

    (() => {
        const data = document.getElementById("subtitle-typing-lines");
        const subtitle = document.querySelector(".quarto-title p.subtitle");

        if (!data || !subtitle) return;

        let lines;

        try {
            lines = JSON.parse(data.textContent);
        } catch {
            return;
        }

        if (!Array.isArray(lines) || lines.length < 2) return;

        const TYPE_TIME_PER_CHARACTER = 40;
        const LINE_PAUSE = 2000;
        const DELETE_DURATION = 750;
        const BETWEEN_LINES_PAUSE = 160;
        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const wait = (milliseconds) => new Promise((resolve) => {
            window.setTimeout(resolve, milliseconds);
        });
        let run = 0;

        document.body.classList.add("subtitle-typing-active");
        subtitle.classList.add("subtitle-typewriter");
        subtitle.setAttribute("aria-label", lines.join(". "));
        subtitle.setAttribute("aria-live", "off");

        function animateCharacters(characters, duration, deleting, currentRun) {
            return new Promise((resolve) => {
                const startedAt = performance.now();

                function frame(now) {
                    if (currentRun !== run || reducedMotion.matches) {
                        resolve(false);
                        return;
                    }

                    const progress = Math.min((now - startedAt) / duration, 1);
                    const count = deleting
                        ? Math.ceil(characters.length * (1 - progress))
                        : Math.floor(characters.length * progress);

                    subtitle.textContent = characters.slice(0, count).join("");

                    if (progress < 1) {
                        window.requestAnimationFrame(frame);
                    } else {
                        resolve(true);
                    }
                }

                window.requestAnimationFrame(frame);
            });
        }

        async function typeLines(currentRun) {
            let lineIndex = 0;

            while (currentRun === run && !reducedMotion.matches) {
                const characters = Array.from(lines[lineIndex]);
                const typeDuration = characters.length * TYPE_TIME_PER_CHARACTER;

                if (!await animateCharacters(characters, typeDuration, false, currentRun)) return;
                await wait(LINE_PAUSE);

                if (currentRun !== run || reducedMotion.matches) return;
                if (!await animateCharacters(characters, DELETE_DURATION, true, currentRun)) return;
                await wait(BETWEEN_LINES_PAUSE);

                lineIndex = (lineIndex + 1) % lines.length;
            }
        }

        function start() {
            run += 1;

            if (reducedMotion.matches) {
                subtitle.classList.add("is-reduced-motion");
                subtitle.textContent = lines.join("\n");
                return;
            }

            subtitle.classList.remove("is-reduced-motion");
            subtitle.textContent = "";
            typeLines(run);
        }

        if (typeof reducedMotion.addEventListener === "function") {
            reducedMotion.addEventListener("change", start);
        } else {
            reducedMotion.addListener(start);
        }

        start();
    })();
</script>
